<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 84" width="212" height="84"
     role="img" aria-label="AISM² — AI Social Media Manager">
  <title>AISM² — AI Social Media Manager</title>
  <!-- The design's wordmark lockup. Two things are deliberate:

       The paper card is baked in, so the logo reads the same on a light or a
       dark page — GitHub renders READMEs in both, and a bare dark wordmark
       disappears on one of them.

       textLength pins the type to an exact width. Space Grotesk will not be
       installed on most machines that open this file, and a fallback font of a
       different width silently pushed the wordmark out through the side of the
       card. Pinned, the layout is the same everywhere. -->
  <rect x="0.5" y="0.5" width="211" height="83" rx="16"
        fill="#ffffff" stroke="rgba(28,30,39,0.08)"/>

  <g transform="translate(28 20)">
    <rect width="44" height="44" rx="12" fill="#1c1e27"/>
    <g transform="translate(9.4 9.4) scale(0.25)">
      <path fill="#faf9f6" fill-rule="evenodd"
            d="M50 8 L84 92 L64 92 L58 74 L42 74 L36 92 L16 92 Z
               M50 38 L55.33 62 L44.67 62 Z"/>
    </g>
    <rect x="29" y="3" width="12" height="12" rx="3"
          fill="#E85C7A" stroke="#1c1e27" stroke-width="1.5"/>
  </g>

  <text x="86" y="52" fill="#1c1e27" textLength="82" lengthAdjust="spacingAndGlyphs"
        font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="700" font-size="30">AISM</text>
  <text x="172" y="40" fill="#E85C7A" textLength="11" lengthAdjust="spacingAndGlyphs"
        font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="700" font-size="17">2</text>
</svg>
