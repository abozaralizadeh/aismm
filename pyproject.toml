[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aismm"
version = "0.1.0"
description = "AI Social Media Manager — an autonomous, agent-driven framework for publishing content to Instagram, X (Twitter), YouTube, and TikTok."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abozar" }]
dependencies = [
    "openai-agents>=0.0.14",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "apscheduler>=3.10.0",
    "Flask[async]>=3.0.0",
    "sqlmodel>=0.0.14",
    "cryptography>=42.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
tracing = ["langsmith>=0.1.0"]
youtube = ["google-api-python-client>=2.0.0", "google-auth-oauthlib>=1.0.0"]
twitter = ["tweepy>=4.14.0"]
azure = ["azure-data-tables>=12.5.0", "azure-storage-blob>=12.19.0"]

[project.scripts]
aismm = "aismm.cli:main"

[tool.setuptools.packages.find]
include = ["aismm*"]
